name: APK 1.3 Parity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HARNESS_REPOSITORY: ExeDesK/Flappy13-APK-TestHarness
  HARNESS_REF: v3.2.2

jobs:
  parity:
    name: Deterministic APK parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PWA
        uses: actions/checkout@v6

      - name: Checkout validation harness
        uses: actions/checkout@v6
        with:
          repository: ${{ env.HARNESS_REPOSITORY }}
          ref: ${{ env.HARNESS_REF }}
          path: .ci/flappy13-apk-harness

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run PWA unit tests
        run: npm test

      - name: Validate APK golden traces
        working-directory: .ci/flappy13-apk-harness
        run: npm test

      - name: Compare PWA against APK 1.3 golden traces
        run: |
          chmod +x .ci/flappy13-apk-harness/*.sh
          ./.ci/flappy13-apk-harness/compare-suite.sh "$GITHUB_WORKSPACE"
