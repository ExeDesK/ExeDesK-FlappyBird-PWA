name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  HARNESS_REPOSITORY: ExeDesK/Flappy13-APK-TestHarness
  HARNESS_REF: v3.2.2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout PWA
        uses: actions/checkout@v6

      - name: Checkout validation harness
        uses: actions/checkout@v6
        with:
          repository: ${{ env.HARNESS_REPOSITORY }}
          ref: ${{ env.HARNESS_REF }}
          path: .ci/flappy13-apk-harness

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run PWA unit tests
        run: npm test

      - name: Validate APK golden traces
        working-directory: .ci/flappy13-apk-harness
        run: npm test

      - name: Verify APK 1.3 parity
        run: |
          chmod +x .ci/flappy13-apk-harness/*.sh
          ./.ci/flappy13-apk-harness/compare-suite.sh "$GITHUB_WORKSPACE"

      - name: Generate Supabase runtime config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const supabaseUrl = process.env.SUPABASE_URL || '';
          const supabasePublishableKey = process.env.SUPABASE_PUBLISHABLE_KEY || '';

          if (!supabaseUrl || !supabasePublishableKey) {
            throw new Error('Missing SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY GitHub secret.');
          }

          const config = { supabaseUrl, supabasePublishableKey };
          writeFileSync(
            'site/config.js',
            `window.FLAPPY_CONFIG = Object.freeze(${JSON.stringify(config, null, 2)});\n`,
          );
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
